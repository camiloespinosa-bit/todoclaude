<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--azul:#145389;--azulOscuro:#2C5F7C;--verde:#7CB342;--naranja:#F57C00;--fondoClaro:#F0F4F8;--amarillo:#FDD835;--t1:#EAF4F6;--t2:#F1F8E9;--t3:#FFF3E0}
*{margin:0;box-sizing:border-box}body{font-family:Poppins,sans-serif;background:#ccc}
.frame{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
/* Perfil 1080x1080: Instagram lo recorta en círculo */
#perfil{width:1080px;height:1080px;background:var(--fondoClaro)}
#perfil .ring{position:absolute;inset:40px;border-radius:50%;background:#fff;border:18px solid var(--azul)}
#perfil img{position:relative;width:760px;margin-top:40px}
/* Destacadas 1080x1920, zona segura circular al centro */
.hl{width:1080px;height:1920px}
.hl .disc{width:820px;height:820px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column}
.hl img{width:600px}
</style></head><body>
<div id="perfil" class="frame"><div class="ring"></div><img src="../../assets/img/oki/oki-base-saludo.svg"></div>
<div id="hl-cca"       class="frame hl" style="background:var(--azulOscuro)"><div class="disc" style="background:var(--fondoClaro)"><img src="../../assets/img/oki/oki-base-saludo.svg"></div></div>
<div id="hl-familias"  class="frame hl" style="background:var(--azulOscuro)"><div class="disc" style="background:var(--t3)"><img src="../../assets/img/oki/oki-empatia.svg"></div></div>
<div id="hl-retos"     class="frame hl" style="background:var(--azulOscuro)"><div class="disc" style="background:var(--t2)"><img src="../../assets/img/oki/oki-ejercitando.svg"></div></div>
<div id="hl-ciencia"   class="frame hl" style="background:var(--azulOscuro)"><div class="disc" style="background:var(--t1)"><img src="../../assets/img/oki/oki-leyendo.svg"></div></div>
<div id="hl-logros"    class="frame hl" style="background:var(--azulOscuro)"><div class="disc" style="background:var(--t2)"><img src="../../assets/img/oki/oki-celebrando.svg"></div></div>
<div id="hl-contacto"  class="frame hl" style="background:var(--azulOscuro)"><div class="disc" style="background:var(--t3)"><img src="../../assets/img/oki/oki-senalando.svg"></div></div>
</body></html>
